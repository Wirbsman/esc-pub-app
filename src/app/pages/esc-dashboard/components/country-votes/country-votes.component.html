<ng-container *ngIf="country">
  <app-header appearance="primary">
    <div class="country-name">{{ country.name }}</div>
    <img class="country-flag" [src]="country.countryIsoCode | countryFlagSrc" [alt]="country.name + ' flag'" />
  </app-header>

  <div class="country-votes-container">
    <div class="tiles-container">
      <app-country-rating-tile
        *ngFor="let userRating of userRatings"
        [countryRating]="userRating"
        class="tile"
      ></app-country-rating-tile>
    </div>
  </div>

  <app-footer>
    <button (click)="toDashboard()">Dashboard</button>
  </app-footer>
</ng-container>
