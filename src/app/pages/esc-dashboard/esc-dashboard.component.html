<app-header appearance="primary">
  <h2>Dashboard</h2>
</app-header>

<div class="content">
  <div class="tiles-container">
    <app-country-dashboard-tile
      *ngFor="let country of countriesSortedForList$ | async"
      [country]="country"
      [routerLink]="country.flag"
      class="tile"
    ></app-country-dashboard-tile>
  </div>
</div>

<app-footer>
  <button (click)="toVote()">Voting</button>
  <button (click)="refresh()">Refresh</button>
</app-footer>
